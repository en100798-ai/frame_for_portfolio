<div id="track">
  <div id="stage">
    <canvas id="video"></canvas>
    <canvas id="textLayer"></canvas>
  </div>
</div>
<div id="reelLoading">loading reel&hellip;&nbsp;<span id="reelPct">0%</span></div>
<div id="reelDbg">reel: starting&hellip;</div>

<script>
/* ---------- scroll-scrubbed reel (Framer embed build, hardened) ---------- */
(function(){
  "use strict";
  var root = document.getElementById('reel-embed');

  var FRAME_BASE  = 'https://cdn.jsdelivr.net/gh/en100798-ai/frame_for_portfolio@main/frames/frame_';
  var FRAME_COUNT = 244;
  var V1_FRAMES   = 122;                 // captions belong to the first video only
  var SRC = Array.from({length:FRAME_COUNT}, function(_,i){
    return FRAME_BASE + String(i+1).padStart(3,'0') + '.jpg';
  });
  var N = SRC.length;
  var V1FRAC = Math.min(1, V1_FRAMES / N);

  var stage   = root.querySelector('#stage');
  var vCanvas = root.querySelector('#video'),     vCtx = vCanvas.getContext('2d');
  var tCanvas = root.querySelector('#textLayer'), tCtx = tCanvas.getContext('2d');
  var track   = root.querySelector('#track');
  var dbgEl   = root.querySelector('#reelDbg');
  var pctEl   = root.querySelector('#reelPct');
  var loadEl  = root.querySelector('#reelLoading');

  var W=0, H=0, DPR=Math.min(window.devicePixelRatio||1,2);
  var images=new Array(N), imgW=1928, imgH=1072, current=-1;
  var started=false, drewReal=false;

  /* progress sources ------------------------------------------------------ */
  var extProg  = null;    // set by parent page via postMessage (pinned mode)
  var virtProg = null;    // set by wheel/drag fallback when nothing can scroll
  var pinnedMode = false;

  window.addEventListener('message', function(e){
    var d=e.data;
    if(d && typeof d.__reel_progress==='number'){
      if(!pinnedMode){ pinnedMode=true;
        track.style.height='100%';
        document.documentElement.style.overflow='hidden';
        document.body.style.overflow='hidden';
      }
      extProg = clamp01(d.__reel_progress);
      schedule();
    }
  });

  function clamp01(v){ return v<0?0:v>1?1:v; }

  function progress(){
    if(extProg  !== null) return extProg;
    if(virtProg !== null) return virtProg;
    var maxScroll = (document.documentElement.scrollHeight || document.body.scrollHeight) - window.innerHeight;
    return maxScroll>2 ? clamp01(window.scrollY / maxScroll) : 0;
  }

  /* captions ------------------------------------------------------------- */
  var CAPTIONS=[
    { lines:[ {text:'Design',size:128,italic:false,weight:400},
              {text:'is not decoration',size:64,italic:false,weight:400,gap:74} ],
      x:0.105, y:0.46, align:'left', range:[0.10,0.185,0.44,0.52] },
    { lines:[ {text:'It\u2019s business',size:64,italic:true,weight:400},
              {text:'infrastructure',size:64,italic:true,weight:400,gap:59} ],
      x:0.10, y:0.64, align:'left', range:[0.60,0.70,0.92,1.0] }
  ];

  var BLOCK=7, cols=0, rows=0, thresh=null;
  function buildGrid(){
    cols=Math.ceil(W/BLOCK)+1; rows=Math.ceil(H/BLOCK)+1;
    thresh=new Float32Array(cols*rows);
    for(var i=0;i<thresh.length;i++) thresh[i]=Math.random();
  }

  var off=document.createElement('canvas'), offCtx=off.getContext('2d');

  function measure(){
    var r = stage.getBoundingClientRect();
    var w = Math.round(r.width)  || window.innerWidth  || document.documentElement.clientWidth;
    var h = Math.round(r.height) || window.innerHeight || document.documentElement.clientHeight;
    return [w,h];
  }

  function resize(){
    var m=measure(), w=m[0], h=m[1];
    if(!w || !h) return false;
    if(w===W && h===H && thresh) return true;   // nothing changed
    W=w; H=h; DPR=Math.min(window.devicePixelRatio||1,2);
    [vCanvas,tCanvas,off].forEach(function(c){ c.width=Math.round(W*DPR); c.height=Math.round(H*DPR); });
    vCtx.setTransform(DPR,0,0,DPR,0,0); tCtx.setTransform(DPR,0,0,DPR,0,0); offCtx.setTransform(DPR,0,0,DPR,0,0);
    buildGrid(); current=-1;
    render(true);
    return true;
  }

  function drawFrame(idx){
    var img=images[idx];
    if(!img || !img.complete || !img.naturalWidth){
      // fall back to the nearest already-decoded frame so we never blank out
      for(var k=1;k<N;k++){
        var a=images[idx-k], b=images[idx+k];
        if(a && a.complete && a.naturalWidth){ img=a; break; }
        if(b && b.complete && b.naturalWidth){ img=b; break; }
      }
      if(!img || !img.naturalWidth) return;
    }
    var iw=img.naturalWidth||imgW, ih=img.naturalHeight||imgH;
    var s=Math.max(W/iw,H/ih), dw=iw*s, dh=ih*s, dx=(W-dw)/2, dy=(H-dh)/2;
    vCtx.clearRect(0,0,W,H); vCtx.drawImage(img,dx,dy,dw,dh);
    drewReal=true;
  }

  function drawCaption(cap,p,alpha){
    if(alpha<=0.001) return;
    offCtx.clearRect(0,0,W,H); offCtx.textBaseline='alphabetic'; offCtx.textAlign=cap.align;
    offCtx.fillStyle='#fff'; offCtx.shadowColor='rgba(0,0,0,0.25)'; offCtx.shadowBlur=Math.round(W*0.012);
    var y=H*cap.y;
    for(var i=0;i<cap.lines.length;i++){
      var ln=cap.lines[i], fs=Math.round(ln.size);
      if(ln.gap) y+=ln.gap;
      offCtx.font=(ln.italic?'italic ':'')+(ln.weight||400)+' '+fs+"px 'Reading Wogue', Georgia, serif";
      offCtx.fillText(ln.text, W*cap.x, y); y+=fs*0.08;
    }
    offCtx.shadowBlur=0;
    var soft=0.14, pp=p*(1+soft);
    for(var r=0;r<rows;r++){ for(var c=0;c<cols;c++){
      var t=thresh[r*cols+c]; var a=(pp-t)/soft; if(a<=0) continue; if(a>1) a=1;
      tCtx.globalAlpha=a*alpha;
      var sx=Math.round(c*BLOCK*DPR), sy=Math.round(r*BLOCK*DPR), b=Math.round(BLOCK*DPR);
      tCtx.drawImage(off, sx,sy,b,b, c*BLOCK,r*BLOCK,BLOCK,BLOCK);
    }}
    tCtx.globalAlpha=1;
  }

  function captionState(cap,gp){
    var a=cap.range[0], b=cap.range[1], cc=cap.range[2], d=cap.range[3];
    if(gp<a) return {p:0,alpha:0};
    var p = gp<b ? (gp-a)/(b-a) : 1, alpha;
    if(gp<=cc) alpha=1; else if(gp<d) alpha=1-(gp-cc)/(d-cc); else alpha=0;
    return {p:p,alpha:alpha};
  }

  var lastGP=-1;
  function render(force){
    if(!W || !H){ if(!resize()) return; }
    var gp=progress();
    var idx=Math.min(N-1,Math.max(0,Math.round(gp*(N-1))));
    if(idx!==current || force){ drawFrame(idx); current=idx; }
    if(force || gp!==lastGP){
      tCtx.clearRect(0,0,W,H);
      var gp1 = V1FRAC>0 ? Math.min(1.3, gp/V1FRAC) : gp;
      for(var i=0;i<CAPTIONS.length;i++){
        var st=captionState(CAPTIONS[i],gp1);
        if(st.alpha>0) drawCaption(CAPTIONS[i],st.p,st.alpha);
      }
      lastGP=gp;
    }
  }

  var ticking=false;
  function schedule(){
    if(ticking) return;
    ticking=true;
    requestAnimationFrame(function(){
      ticking=false;
      try{ render(false); }catch(err){ dbg('err: '+(err&&err.message||err)); }
    });
  }

  /* diagnostic line ---------------------------------------------------- */
  function dbg(msg){ if(dbgEl) dbgEl.textContent = msg; }
  function dbgLive(){
    if(!dbgEl || dbgEl.classList.contains('hide')) return;
    var canScroll = ((document.documentElement.scrollHeight||0) - window.innerHeight) > 2;
    var mode = extProg!==null ? 'pinned' : virtProg!==null ? 'wheel' : canScroll ? 'scroll' : 'none';
    dbg('reel: loaded '+loaded+'/'+N+'  box '+W+'x'+H+'  mode '+mode+'  y='+Math.round(window.scrollY));
  }

  /* wheel / drag fallback: used only if the iframe cannot scroll and the
     parent page is not feeding progress. Keeps the reel usable anywhere. */
  function enableWheelFallback(){
    if(virtProg!==null || extProg!==null) return;
    virtProg = progress() || 0;
    var SPEED = 1/2600;   // wheel px -> progress
    root.addEventListener('wheel', function(e){
      if(extProg!==null) return;
      var next = clamp01(virtProg + e.deltaY*SPEED);
      // only swallow the wheel while there is reel left to play in that direction
      if(next!==virtProg && next>0 && next<1) e.preventDefault();
      virtProg = next;
      schedule();
    }, {passive:false});
    var lastY=null;
    root.addEventListener('touchstart', function(e){ lastY=e.touches[0].clientY; }, {passive:true});
    root.addEventListener('touchmove', function(e){
      if(extProg!==null || lastY===null) return;
      var y=e.touches[0].clientY, dy=lastY-y; lastY=y;
      virtProg = clamp01(virtProg + dy*(1/900));
      if(virtProg>0 && virtProg<1) e.preventDefault();
      schedule();
    }, {passive:false});
    dbgLive();
  }

  /* boot ------------------------------------------------------------- */
  var loaded=0;
  function onImg(i, img){
    loaded++;
    if(i===0){ imgW=img.naturalWidth||imgW; imgH=img.naturalHeight||imgH; }
    if(pctEl) pctEl.textContent = Math.round(loaded/N*100)+'%';
    // draw the very first frame as soon as it is available
    if(loaded>=1 && !drewReal){ resize(); render(true); }
    if(loaded===N) finishLoading();
  }
  function preload(){
    for(var i=0;i<N;i++){
      (function(i){
        var img=new Image(); img.decoding='async';
        img.onload = img.onerror = function(){ onImg(i,img); };
        img.src=SRC[i]; images[i]=img;
      })(i);
    }
  }

  function finishLoading(){
    if(loadEl){ loadEl.classList.add('hide'); setTimeout(function(){ loadEl.remove(); }, 700); }
  }

  function begin(){
    if(started) return; started=true;
    resize();
    window.addEventListener('scroll',  schedule, {passive:true});
    window.addEventListener('resize',  function(){ resize(); });
    if('ResizeObserver' in window){ new ResizeObserver(function(){ resize(); }).observe(stage); }
    document.addEventListener('visibilitychange', function(){ if(!document.hidden){ resize(); } });

    // keep trying to size for a few seconds (Framer tabs / lazy mount / late layout)
    var tries=0;
    var iv=setInterval(function(){
      tries++;
      resize(); dbgLive();
      var canScroll = ((document.documentElement.scrollHeight||0) - window.innerHeight) > 2;
      if(tries===8 && !canScroll && extProg===null){ enableWheelFallback(); }
      if(tries>=24){ clearInterval(iv); }
    }, 250);

    // fade the debug line once we are actually rendering frames
    setTimeout(function(){
      if(drewReal && dbgEl){ dbgEl.classList.add('hide'); }
      else { dbgLive(); }
    }, 6000);

    render(true);
    dbgLive();
  }

  // start rendering as soon as fonts settle OR after a short grace period,
  // whichever comes first - never block the reel on font loading
  var kicked=false;
  function kick(){ if(kicked) return; kicked=true; begin(); }
  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(kick).catch(kick); }
  setTimeout(kick, 1200);

  preload();
})();
</script>
</div>
